<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pirate Pop Escape — A Friendly Mini Escape Room</title>
  <meta name="description" content="A single-file, kid-and-grownup-friendly escape room for the browser. Bright visuals, simple puzzles, mobile friendly, GitHub Pages ready." />
  <style>
    :root{
      --bg:#06131a; --sea:#0b2540; --sand:#fed7aa; --text:#fff8f0; --muted:#ffe8d4;
      --pink:#ff80ab; --yellow:#ffd166; --green:#06d6a0; --blue:#5ab3ff; --purple:#b39ddb; --dark:#0b1020;
      --line:#143a52; --card:#0e2135; --good:#19d176; --bad:#ff6b6b; --warn:#ffd166;
    }
    *,*:before,*:after{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--sea),#072033 50%,#051520);color:var(--text)}
    .app{max-width:1100px;margin:0 auto;padding:16px 16px 120px}
    header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin:10px 0 18px}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:46px;height:46px;border-radius:14px;background:conic-gradient(from 120deg,var(--pink),var(--yellow),var(--green),var(--blue));display:grid;place-items:center;color:#06202c;font-weight:900;box-shadow:0 12px 30px #0008}
    .subtitle{color:var(--muted);font-size:13px}
    .hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .chip{background:#0d2235;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:12px}
    .btn{cursor:pointer;border:1px solid var(--line);background:#0a1a29;color:var(--text);padding:10px 14px;border-radius:12px;transition:transform .08s ease,filter .2s ease}
    .btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
    .btn.primary{background:linear-gradient(135deg,var(--pink),var(--yellow));color:#08222b;border:none}

    .layout{display:grid;grid-template-columns:320px 1fr;gap:16px}
    @media (max-width:900px){.layout{grid-template-columns:1fr}}

    .panel{background:#0c1f31;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px #0006;overflow:hidden}
    .panel h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);background:#0f2941}
    .panel .body{padding:14px}

    /* Scene */
    .scene{aspect-ratio:16/10;min-height:320px;position:relative;border-radius:16px;border:2px solid var(--line);overflow:hidden;background:
      linear-gradient(180deg,#0e3354 0 58%, var(--sand) 58%);
    }
    .wave{position:absolute;inset:0 0 auto 0;height:58%;background:radial-gradient(1400px 400px at 10% -40%,#58afff40,transparent 60%)}
    .beach{position:absolute;inset:auto 0 0 0;height:42%;background:repeating-linear-gradient(45deg, #ffd7a6, #ffd7a6 6px,#fecb8e 6px,#fecb8e 12px)}

    /* Tap targets */
    .hotspot{position:absolute;outline:2px dashed transparent;transition:outline-color .2s ease, transform .08s ease}
    .hotspot:focus-visible{outline-color:#7dd3fc;border-radius:10px}
    .hotspot button{all:unset;display:block;width:100%;height:100%;cursor:pointer}

    /* Objects */
    .flag{left:6%;top:10%;width:18%;height:28%;border-radius:10px;background:linear-gradient(90deg,var(--pink) 0 25%,var(--yellow) 25% 50%,var(--green) 50% 75%,var(--blue) 75%);border:2px solid #ffffff33;box-shadow:0 6px 18px #0006}
    .desk{left:26%;bottom:10%;width:34%;height:22%;background:linear-gradient(#11304f,#0e2840);border:2px solid #ffffff22;border-radius:10px}
    .chest{left:68%;bottom:12%;width:18%;height:24%;background:linear-gradient(#7b4b17,#5b360f);border:2px solid #3b250b;border-radius:12px;box-shadow:inset 0 0 0 6px #3f2a10}
    .barrel{left:60%;top:18%;width:14%;height:40%;background:radial-gradient(circle at 30% 30%,#84562a,#5a3618);border:2px solid #3b250b;border-radius:12px}
    .door{right:4%;top:10%;width:16%;height:70%;background:linear-gradient(#082234,#0b2b44);border:2px solid #0f3a57;border-radius:12px;box-shadow:inset 0 0 0 6px #0a2236}
    .door:after{content:"";position:absolute;right:10%;top:44%;width:12px;height:12px;border-radius:50%;background:#ffd166}

    /* Inventory */
    .inventory{display:flex;flex-wrap:wrap;gap:8px}
    .slot{flex:1 0 72px;min-width:72px;height:66px;border:1px dashed #477aa6;border-radius:10px;display:grid;place-items:center;color:#e0f2fe;font-size:12px;position:relative;background:#0a1f31}
    .slot.have{border-style:solid;border-color:#8be9ff;color:#fff}
    .slot .qty{position:absolute;right:8px;bottom:6px;background:#07314d;border:1px solid #477aa6;border-radius:999px;padding:2px 6px;font-size:10px}

    /* Modal */
    dialog{border:none;border-radius:16px;padding:0;background:#0a1f31;color:var(--text);max-width:min(720px,92vw);box-shadow:0 40px 120px #000a}
    dialog::backdrop{background:linear-gradient(#06131acc,#06131add)}
    .modal-head{padding:12px 16px;border-bottom:1px solid var(--line);background:#0f2941;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .modal-body{padding:16px}
    .input, input[type="text"], input[type="number"], .keypad-input{background:#0b1d2d;border:1px solid #2c5677;border-radius:12px;color:var(--text);padding:10px 12px;width:100%}
    .grid{display:grid;gap:10px}
    .grid.cols-2{grid-template-columns:1fr 1fr}
    .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .keypad button{padding:14px 0;border-radius:12px;border:1px solid #2c5677;background:#0b1d2d;color:#e5f0ff;cursor:pointer}
    .note{border-left:4px solid var(--yellow);background:#2a3b4a;padding:10px 12px;border-radius:8px;color:#fff7e6}
    .hint{border-left:4px solid var(--pink);background:#3a2842;color:#ffe6f5}

    /* Toast */
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:grid;gap:8px;max-width:90vw;z-index:99}
    .toast .t{background:#0b1d2d;border:1px solid var(--line);border-radius:12px;padding:10px 12px}

    footer{position:fixed;inset:auto 0 0 0;background:linear-gradient(180deg,transparent,#0006 20%,#000e);backdrop-filter:blur(6px);padding:10px}
    .footer-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="brand">
        <div class="logo">🏴‍☠️</div>
        <div>
          <div style="font-weight:800;letter-spacing:.04em;font-size:18px">Pirate Pop Escape</div>
          <div class="subtitle">Bright, beginner‑friendly puzzles • Mobile & keyboard ready • Single file</div>
        </div>
      </div>
      <div class="hud">
        <div class="chip" aria-live="polite">⏱ <span id="timer">00:00</span></div>
        <div class="chip">🔓 To go: <span id="locksLeft">3</span></div>
        <button class="btn" id="btnHint">💡 Hint</button>
        <button class="btn" id="btnReset">↺ Reset</button>
        <button class="btn primary" id="btnSave">💾 Save</button>
      </div>
    </header>

    <div class="layout">
      <div class="panel">
        <h3>Inventory</h3>
        <div class="body">
          <div class="inventory" id="inventory" role="list" aria-label="Inventory"></div>
        </div>
      </div>
      <div class="panel">
        <h3>Pirate Hut</h3>
        <div class="body">
          <div class="scene" id="scene" aria-label="Room scene">
            <div class="wave"></div>
            <div class="beach"></div>
            <div class="hotspot flag" role="button" aria-label="Striped pirate flag" tabindex="0" data-action="flag"></div>
            <div class="hotspot desk" role="button" aria-label="Desk with map" tabindex="0" data-action="desk"></div>
            <div class="hotspot chest" role="button" aria-label="Treasure chest with number lock" tabindex="0" data-action="chest"></div>
            <div class="hotspot barrel" role="button" aria-label="Barrel with word lock" tabindex="0" data-action="barrel"></div>
            <div class="hotspot door" role="button" aria-label="Exit door" tabindex="0" data-action="door"></div>
          </div>
        </div>
      </div>
    </div>

    <dialog id="modal">
      <div class="modal-head">
        <div id="modalTitle" style="font-weight:700">Modal</div>
        <button class="btn" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </dialog>

    <div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>

    <footer>
      <div class="footer-inner">
        <div>Protip: <kbd>H</kbd> = hint, <kbd>S</kbd> = save, <kbd>R</kbd> = reset.</div>
        <div>© Pirate Pop • MIT License</div>
      </div>
    </footer>
  </div>

  <script>
  ;(()=>{
    const STORAGE_KEY='pirate_pop_state_v1';
    const $=(s,e=document)=>e.querySelector(s); const $$=(s,e=document)=>[...e.querySelectorAll(s)];

    const state={
      startedAt:null, elapsed:0,
      locks:{chest:false,barrel:false,door:false},
      items:{key:false,map:false,coin:false},
      seenFlag:false
    };

    // Utils
    const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    const toast=(m,c='')=>{const t=document.createElement('div');t.className='t '+c;t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>t.remove(),2400)};

    // Timer
    let tick=null; function startTimer(){ if(state.startedAt==null){state.startedAt=Date.now()-state.elapsed*1000} if(tick)clearInterval(tick); tick=setInterval(()=>{state.elapsed=Math.floor((Date.now()-state.startedAt)/1000); $('#timer').textContent=fmt(state.elapsed)},1000) }

    // Save/load/reset
    function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); toast('Saved.') }
    function load(){ const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return false; try{Object.assign(state,JSON.parse(raw)); updateUI(); startTimer(); toast('Loaded.'); return true;}catch(e){return false}}
    function reset(){ Object.assign(state,{startedAt:null,elapsed:0,locks:{chest:false,barrel:false,door:false},items:{key:false,map:false,coin:false},seenFlag:false}); clearInterval(tick); tick=null; $('#timer').textContent='00:00'; updateUI(); toast('Reset.') }

    // Inventory
    const INV=[
      {id:'map',label:'Treasure Map',emoji:'🗺️',hint:'Hints for the barrel word.'},
      {id:'key',label:'Pirate Key',emoji:'🗝️',hint:'Opens the door lock.'},
      {id:'coin',label:'Doubloon',emoji:'🪙',hint:'Not needed to escape, but shiny!'},
    ];
    function renderInv(){ const box=$('#inventory'); box.innerHTML=''; for(const s of INV){ const have=!!state.items[s.id]; const el=document.createElement('div'); el.className='slot'+(have?' have':''); el.setAttribute('role','listitem'); el.innerHTML=have?`${s.emoji} ${s.label}`:'— empty —'; el.title=have?s.hint:''; box.appendChild(el);} }

    function updateLocksLeft(){ const left=Object.values(state.locks).filter(v=>!v).length; $('#locksLeft').textContent=String(left); if(left===0) setTimeout(win,300); }

    // Modal helpers
    const modal=$('#modal'); const openModal=(title,html)=>{ $('#modalTitle').textContent=title; $('#modalBody').innerHTML=html; modal.showModal(); };
    $('#modalClose').addEventListener('click',()=>modal.close());

    // Scene interactions
    $('#scene').addEventListener('click',e=>{ const el=e.target.closest('.hotspot'); if(!el) return; handle(el.dataset.action); });
    $('#scene').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ const el=document.activeElement.closest('.hotspot'); if(!el) return; handle(el.dataset.action);} });

    function handle(a){ if(!state.startedAt) startTimer(); if(a==='flag') onFlag(); if(a==='desk') onDesk(); if(a==='chest') onChest(); if(a==='barrel') onBarrel(); if(a==='door') onDoor(); }

    // Flag = fun intro hint (colorful)
    function onFlag(){
      state.seenFlag=true;
      openModal('Striped Flag',`
        <div class="note">The parrot squawks: <b>"Colors are just for fun!"</b><br/>No puzzle here — but remember: pirates love bright things and simple clues.</div>
        <p class="subtitle">Tip: Each lock has a clue you can read. Hints are friendly and won’t trick you.</p>
      `);
    }

    // Desk = get MAP and a simple note
    function onDesk(){
      const gotAll = state.items.map && state.items.coin;
      openModal('Desk',`
        <p>On the desk you see a doodled <b>map</b> and a shiny <b>doubloon</b>.</p>
        <div class="grid cols-2">
          <button class="btn" id="takeMap">🗺️ Take Map</button>
          <button class="btn" id="takeCoin">🪙 Take Doubloon</button>
        </div>
        ${gotAll?'<p class="subtitle">Looks like you already grabbed the goodies.</p>':''}
        <div class="hint" style="margin-top:10px">The map’s poem acrostic is helpful: <br/> <i>Glow of sunrise<br/> Over the dunes<br/> Lure of treasure<br/> Deep in the blue</i></div>
      `);
      $('#takeMap')?.addEventListener('click',()=>{ if(!state.items.map){ state.items.map=true; toast('Picked up the Treasure Map.'); updateUI(); }});
      $('#takeCoin')?.addEventListener('click',()=>{ if(!state.items.coin){ state.items.coin=true; toast('Picked up a Doubloon!'); updateUI(); }});
    }

    // Chest = simple 3-digit (Count-Me) — directly clued
    function onChest(){
      const solved=state.locks.chest;
      openModal('Number Lock Chest',`
        ${solved?'<p class="subtitle">Chest already open. You took the key.</p>':`
        <div class="note">Clue stuck on the lid: <b>"Count skulls, parrots, and wheels in our hut!"</b><br/>Look around the artwork: there are <b>3 skulls</b>, <b>1 parrot</b>, and <b>2 ship wheels</b> hidden in the decor. Put them in that order.</div>
        <div class="grid" style="gap:12px;margin-top:8px">
          <input class="keypad-input" id="codeA" inputmode="numeric" maxlength="3" placeholder="3‑digit code (e.g., 312)" />
          <div class="keypad" aria-hidden="true">${[1,2,3,4,5,6,7,8,9,'←',0,'⏎'].map(n=>`<button data-k="${n}">${n}</button>`).join('')}</div>
        </div>`}
      `);
      if(!solved){ const inp=$('#codeA'); $('.keypad').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const k=b.dataset.k; if(k==='←'){ inp.value=inp.value.slice(0,-1); return;} if(k==='⏎'){ tryChest(inp.value); return;} if((inp.value||'').length<3 && /\d/.test(k)) inp.value+=k; }); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tryChest(inp.value) }); }
    }
    function tryChest(val){ if(val==='312'){ state.locks.chest=true; state.items.key=true; modal.close(); toast('Chest opens! You got the Pirate Key.','good'); updateUI(); } else toast('Not quite. Try the order: skulls, parrots, wheels.','bad'); }

    // Barrel = 4-letter word from map acrostic: G O L D
    function onBarrel(){
      const solved=state.locks.barrel;
      openModal('Barrel (Word Lock)',`
        ${solved?'<p class="subtitle">It\'s empty now. You already solved it.</p>':`
        <p>A friendly four-letter lock. The map\'s poem hides the answer with the <b>first letters</b> of each line.</p>
        <div class="grid" style="gap:10px">
          <input id="wordLock" class="input" maxlength="4" placeholder="4‑letter word" />
          <button class="btn" id="btnTryWord">Try</button>
        </div>
        ${state.items.map?'<p class="note">You inspect the map… those first letters spell something shiny.</p>':'<p class="hint">Maybe grab the map from the desk first.</p>'}`
      );
      if(!solved){ $('#btnTryWord').addEventListener('click',()=>{ const w=($('#wordLock').value||'').trim().toUpperCase(); if(w==='GOLD'){ state.locks.barrel=true; modal.close(); toast('Clack! The barrel opens (just snacks inside).','good'); updateUI(); } else toast('That\'s not the shiny word.','bad'); }); }
    }

    // Door = needs key + friendly magic word "OPEN" (explicit clue)
    function onDoor(){
      if(!state.items.key){ openModal('Door',`<p>The door has a simple keypad and a keyhole. You\'ll need a <b>key</b> first.</p>`); return; }
      const solved=state.locks.door;
      openModal('Door', solved? '<p class="subtitle">Door is open — fresh sea breeze! 🏝️</p>' : `
        <div class="note">You turn the key. A parrot above the door says: <b>"Say the magic word!"</b></div>
        <div class="grid" style="gap:10px; margin-top:8px">
          <input id="doorWord" class="input" maxlength="4" placeholder="Magic word (4 letters)" />
          <button class="btn" id="btnDoorTry">Unlock</button>
        </div>
        <p class="subtitle">(It\'s the polite one pirates forget.)</p>
      `);
      if(!solved){ $('#btnDoorTry').addEventListener('click',()=>{ const v=($('#doorWord').value||'').trim().toUpperCase(); if(v==='OPEN'){ state.locks.door=true; modal.close(); win(); updateUI(); } else toast('Polly squawks: "Not that word!"','bad'); }); }
    }

    // Hints (gentle, no trickery)
    const HINTS=[
      'Tap around: Flag, Desk, Chest, Barrel, Door.',
      'Chest: Use the clue on the lid — just count. Order: skulls, parrots, wheels.',
      'Barrel: The map\'s poem hides letters. Read the FIRST letters down the left.',
      'Door: You need the key from the chest, then type the polite 4-letter magic word.',
      'Stuck? Try numbers before words, then finish at the door.'
    ];
    let hintIdx=0; function giveHint(){ toast(HINTS[Math.min(hintIdx++,HINTS.length-1)]) }

    function win(){ clearInterval(tick); tick=null; openModal('You Escaped! 🎉',`
      <p>Well done, captain! Final time: <b>${fmt(state.elapsed)}</b>.</p>
      <div class="grid cols-2" style="margin-top:10px">
        <button class="btn" id="again">Play Again</button>
        <button class="btn primary" id="share">Share Time</button>
      </div>
      <p class="subtitle">Tip: Save this as <code>index.html</code> in a GitHub repo and enable GitHub Pages.</p>
    `); $('#again').addEventListener('click',()=>{ modal.close(); reset(); startTimer(); }); $('#share').addEventListener('click',()=>{ const txt=`I escaped Pirate Pop in ${fmt(state.elapsed)}!`; navigator.clipboard?.writeText(txt); toast('Copied!') }); }

    // Wire up
    $('#btnHint').addEventListener('click',giveHint); $('#btnSave').addEventListener('click',save); $('#btnReset').addEventListener('click',reset);
    window.addEventListener('keydown',e=>{ if(e.key==='h'||e.key==='H') giveHint(); if(e.key==='s'||e.key==='S') save(); if(e.key==='r'||e.key==='R') reset(); });

    function updateUI(){ renderInv(); updateLocksLeft(); }

    // Kickoff
    updateUI(); load(); if(!state.startedAt){ startTimer(); }
  })();
  </script>
</body>
</html>
